[build-system]
requires = ["setuptools>=77"]  # >=77 understands the PEP 639 SPDX license fields
build-backend = "setuptools.build_meta"

[project]
name = "fsphotonix"
version = "0.1.0"
description = "Large-scale free-space photonic system simulator: sources, holographic modulator arrays, cascaded diffractive stages, detector arrays and analog/digital feedback loops"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Ganesh Chennimalai Sankaran", email = "gsankara@cse.iitm.ac.in" }]
keywords = [
    "photonics", "optics", "diffraction", "holography", "spatial light modulator",
    "free-space optics", "optical computing", "analog iterative machine",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/gsankara/fsphotonix"
Repository = "https://github.com/gsankara/fsphotonix"
Issues = "https://github.com/gsankara/fsphotonix/issues"

[project.optional-dependencies]
full = ["scipy>=1.10", "matplotlib>=3.7", "pyyaml>=6.0"]
gpu = ["cupy-cuda12x"]
dev = ["pytest>=7", "scipy>=1.10", "matplotlib>=3.7", "pyyaml>=6.0"]

[project.scripts]
fsphotonix = "fsphotonix.cli:main"

[tool.setuptools.packages.find]
include = ["fsphotonix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]
